<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cultural Dimensions Map</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <header>
          <h1>Cultural Dimensions <button id="btn-help" type="button" class="help" title="About the axes" aria-label="About the axes"></button></h1>
          <p class="sub">Hofstede &amp; Inglehart–Welzel, in 1D / 2D / 3D</p>
        </header>
        <section class="edition" id="edition-section" hidden>
          <span class="seg-label">Hofstede edition</span>
          <div class="seg" id="edition-switch">
            <button type="button" data-ed="2015">2015</button>
            <button type="button" data-ed="2023">2023</button>
          </div>
        </section>
        <section class="axes">
          <label>X axis <select id="axis-x" autocomplete="off"></select></label>
          <label>Y axis <select id="axis-y" autocomplete="off"></select></label>
          <label>Z axis <select id="axis-z" autocomplete="off"></select></label>
        </section>
        <section class="options">
          <label class="inline"><input type="checkbox" id="opt-labels" checked /> Labels</label>
          <button id="btn-reset-view" type="button">Reset view</button>
          <button id="btn-export" type="button" class="with-icon" title="Download the chart as a PNG">Export PNG</button>
          <label class="inline"><input type="checkbox" id="opt-heatmap" /> Region heatmap</label>
          <label class="inline spread">Spread <input type="range" id="opt-heat-spread" min="0" max="1" step="0.01" value="0.5" /></label>
        </section>
        <section class="countries">
          <div class="countries-head">
            <input id="country-search" type="search" autocomplete="off" placeholder="Search countries…" />
            <div class="btns">
              <button id="btn-all" type="button">All</button>
              <button id="btn-none" type="button">None</button>
              <button id="btn-unpin" type="button" hidden title="Unpin everything">Unpin</button>
            </div>
          </div>
          <div id="country-list"></div>
        </section>
        <footer id="sources"></footer>
      </aside>
      <main id="viewport">
        <div id="tooltip" hidden></div>
        <div id="ctx-menu" hidden></div>
        <div id="compare" hidden>
          <div class="compare-head"><b>Pinned comparison</b><span class="count" id="compare-count"></span><button id="compare-toggle" type="button" title="Collapse"></button></div>
          <div class="compare-body"><table id="compare-table"></table></div>
        </div>
        <div id="empty-hint" hidden>No selected country has data for every chosen axis.</div>
      </main>
    </div>
    <dialog id="help-modal">
      <div class="modal-head"><h2>About the axes</h2><button id="btn-help-close" type="button" aria-label="Close"></button></div>
      <div id="help-body" class="modal-body"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
